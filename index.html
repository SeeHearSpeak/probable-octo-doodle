<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poti - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="parent-container">  
    <div class="container">
            <h1 class="indie-flower heading">Login</h1>
        <form class="form-box">
            <div class="input-group">
                <label for="Username" class="floating-label indie-flower2">Username</label>
                <input type="Username" id="Username" class="inputfield indie-flower3" placeholder="Username here" required>
            </div>

            <div class="input-group">
                <label for="password" class="floating-label indie-flower2">Password</label>
                <input type="password" id="password" class="inputfield indie-flower3" placeholder="Password here" required>

                <div class="eye-icon"></div>
            </div>
            <div class="input-group-checkbox-group">
                <div class="form-col remember-me">
                    <label class="remember-me-checkbox indie-flower2">
                        <input type="checkbox">
                            <span class="checkmark"></span>
                                Remember me
                    </label>

                </div>
            </div>
            <button type="submit" class="form-btn2 form-btn---submit indie-flower3">Login</button>
        </form>
            <a href="register.html" class="indie-flower2">Create an account now</a>
        </div>
    </div>
</div>
</body>
</html>
