<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poti - Register</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
<div class="parent-signup-container">
<div class="signup-container">
    <h1 class="indie-flower heading2">Create an Account</h1>
    <form id="signupForm">
        <div class="input-group2">
            <label for="username" class="indie-flower2">Username</label>
            <input type="text" id="username" placeholder="Username..." class="inputfield2 indie-flower3" required>
        </div>
        <div class="input-group2">
            <label for="password" class="indie-flower2">Password</label>
            <input type="password" id="password" placeholder="Password..." class="inputfield2 indie-flower3" required>
        </div>
        <div class="input-group2">
            <label for="confirmPassword" class="indie-flower2">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password..." class="inputfield2 indie-flower3" required>
        </div>
        <button type="submit" class="indie-flower3 form-btn">Sign Up</button>
    </form>
    <p id="message"></p>
    <a href="login.html" class="link">Already have an account? Login here!</a>
</div>
</div>

</body>
</html>
